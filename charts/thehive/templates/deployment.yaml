apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "thehive.fullname" . }}
  labels:
    {{- include "thehive.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate          # RWO disk can only be attached to one pod
  selector:
    matchLabels:
      {{- include "thehive.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "thehive.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
        fsGroup: 1000
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-cassandra
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z -w 3 {{ .Values.cassandra.host }} {{ .Values.cassandra.port }}; do
                echo "waiting for cassandra at {{ .Values.cassandra.host }}:{{ .Values.cassandra.port }}"; sleep 5
              done
      containers:
        - name: thehive
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --no-config
            - --config-file
            - /etc/thehive/application.conf
          env:
            - name: PLAY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret.name }}
                  key: {{ .Values.existingSecret.key }}
            - name: JVM_OPTS
              value: {{ .Values.jvmOpts | quote }}
          ports:
            - name: http
              containerPort: 9000
          # First start creates the schema in Cassandra; allow up to ~10 min
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/thehive/application.conf
              subPath: application.conf
            - name: data
              mountPath: {{ .Values.fileStorage.location }}
              subPath: files
            {{- if ne .Values.index.backend "elasticsearch" }}
            - name: data
              mountPath: {{ .Values.index.luceneDirectory }}
              subPath: index
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "thehive.fullname" . }}-config
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "thehive.fullname" . }}-data
