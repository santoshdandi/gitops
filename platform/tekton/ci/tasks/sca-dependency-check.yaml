```yaml
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: sca-dependency-check
  namespace: cicd

spec:
  workspaces:
    - name: source
      description: Application source code

  params:
    - name: fail-cvss
      type: string
      default: "7.0"
      description: CVSS score at or above which the SCA task fails

  results:
    - name: report
      description: Path to the generated Dependency-Check report

  steps:
    - name: dependency-check
      image: maven:3.9.11-eclipse-temurin-17
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu

        mvn org.owasp:dependency-check-maven:13.0.0:check \
          -DfailBuildOnCVSS=$(params.fail-cvss) \
          -Dformats=HTML,JSON

        printf '%s' "$(workspaces.source.path)/target" \
          > "$(results.report.path)"
```
