apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: maven-build
  namespace: cicd

spec:
  workspaces:
    - name: source
      description: Application source code

  params:
    - name: goals
      type: string
      default: "clean verify"
      description: Maven goals to execute

  steps:
    - name: build
      image: maven:3.9.11-eclipse-temurin-17
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu

        mvn $(params.goals)