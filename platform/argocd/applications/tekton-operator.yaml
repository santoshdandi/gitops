apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tekton-operator
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/santoshdandi/gitops.git
    targetRevision: main
    path: platform/tekton/operator

  destination:
    server: https://kubernetes.default.svc
    namespace: tekton-operator

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true